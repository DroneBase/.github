# DOPE-1327 — org-wide secret scan. Scans the commits a change adds, fails the check, pings Slack.
# The CI layer; pre-commit hooks and GHAS push protection are the other two.
#
# Not meant to be copied into repos. The organization ruleset's `workflows` rule injects it
# into them, the same way validate-pr.yml is injected, so enrolling a repo is a ruleset edit
# rather than a PR against that repo:
#
#   { "path": ".github/workflows/secret-scan.yml",
#     "repository_id": 1235329652,          # DroneBase/.github
#     "ref": "refs/heads/main" }
#
# Self-contained on purpose. This repo is PUBLIC and reusable-workflows is PRIVATE, and a
# public repo cannot call a private repo's reusable workflow — `access_level: organization`
# does not override that. Verified: a thin caller here fails to resolve before any job starts,
# so it reports no check at all, which is the worst possible failure for a required check.
# Slack therefore goes out via curl rather than reusable-workflows/github_actions_bot.yaml.
#
# Scope is only ever newly added commits, never full history. Most org repos carry historical
# leaks (DOPE-1051 found them across the org); scanning history would turn every run in those
# repos permanently red. History is fixed by rotation, not by this check.
#
# Rules come from the ref being scanned FROM — the PR base, or the branch's prior tip — never
# from the incoming commits. See the policy step for why that is the difference between a
# control and a formality. To silence a false positive, land its fingerprint in
# `.gitleaksignore` on the repo's default branch, where someone reviews it.
#
# It cannot filter on branch names, because it runs inside repos whose default branch is
# variously main, master, staging and develop. Hence the `if` below.

name: Secret Scan

on:
  pull_request:
  push:

jobs:
  secret-scan:
    # Every PR, plus pushes that land on whatever this repo calls its default branch — a
    # direct push there never opens a PR and would otherwise skip the check entirely.
    if: >-
      github.event_name == 'pull_request'
      || github.ref_name == github.event.repository.default_branch
    name: "gitleaks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # ponytail: full clone so the range's start commit is always present. Slow on the few
      # monorepos; narrow to a computed fetch-depth if that ever actually hurts.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # OSS CLI, not gitleaks-action — that action wants a paid GITLEAKS_LICENSE for org repos.
      # Digest is pinned rather than trusted: a swapped release asset would otherwise run on
      # every repo in the org. No sudo either — nothing here needs it.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf gitleaks.tgz -C "${RUNNER_TEMP}/bin" gitleaks
          rm -f gitleaks.tgz
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/gitleaks" version

      - name: Scan new commits
        id: scan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          NIL: "0000000000000000000000000000000000000000"
          # gitleaks exits 1 on its own fatal errors too, so give findings their own code.
          LEAK_CODE: "42"
        run: |
          set -u

          # -m --first-parent, not --no-merges: a secret written while resolving a merge
          # conflict lives ONLY in the merge commit, and gitleaks' git backend diffs no merge
          # commit at all without -m, so --no-merges and plain omission both miss it entirely.
          # --first-parent keeps the diff against the branch's own side, so commits the merge
          # pulled in from the base branch stay out of scope instead of re-flagging old leaks.
          if [ -n "$PR_BASE" ]; then
            policy_ref="$PR_BASE"
            endpoints="$PR_BASE $PR_HEAD"
            log_opts="-m --first-parent ${PR_BASE}..${PR_HEAD}"
            where="<${PR_URL}|PR #${PR_NUMBER}>"
          elif [ "$PUSH_BEFORE" = "$NIL" ]; then
            # Branch created by this push, so there is no "before" to diff against, and no
            # trusted prior state to take policy from. Only the tip is new in any meaningful
            # sense; the rest is imported history. Defaults here fail strict, which is right.
            policy_ref=""
            endpoints="$PUSH_AFTER"
            log_opts="-m --first-parent -1 ${PUSH_AFTER}"
            where="a new ${GITHUB_REF_NAME} branch"
          else
            policy_ref="$PUSH_BEFORE"
            endpoints="$PUSH_BEFORE $PUSH_AFTER"
            log_opts="-m --first-parent ${PUSH_BEFORE}..${PUSH_AFTER}"
            where="a direct push to ${GITHUB_REF_NAME}"
          fi

          # Fail closed on an unresolvable range. Given a sha it cannot reach, gitleaks exits
          # 0 with zero findings — indistinguishable from a genuinely clean scan, so a
          # force-push or a shallow fetch would quietly turn this check green. Verified.
          for sha in $endpoints; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || {
              echo "::error::${sha} is not in this checkout; refusing to report a clean scan"
              exit 2
            }
          done

          # Policy must come from policy_ref, never from the incoming commits — otherwise the
          # same PR that adds a secret can add a rule-less .gitleaks.toml, or its own
          # fingerprint to .gitleaksignore, and turn this check green.
          #
          # Pointing the flags elsewhere is NOT enough, verified the hard way: gitleaks always
          # honours ./.gitleaksignore from the scan target on top of --gitleaks-ignore-path,
          # and auto-loads ./.gitleaks.toml whenever --config is absent. So both files get
          # deleted from the checkout and --config is always passed explicitly. Safe to
          # delete: the scan reads commits, nothing here builds from the worktree.
          rm -f .gitleaks.toml .gitleaksignore

          policy="${RUNNER_TEMP}/gitleaks-policy"
          mkdir -p "$policy"
          : > "${policy}/.gitleaksignore"
          if [ -n "$policy_ref" ] && git cat-file -e "${policy_ref}:.gitleaks.toml" 2>/dev/null; then
            git show "${policy_ref}:.gitleaks.toml" > "${policy}/.gitleaks.toml"
            echo "rules:    .gitleaks.toml @ ${policy_ref}"
          else
            printf 'title = "pinned defaults"\n[extend]\nuseDefault = true\n' > "${policy}/.gitleaks.toml"
            echo "rules:    gitleaks defaults"
          fi
          if [ -n "$policy_ref" ] && git cat-file -e "${policy_ref}:.gitleaksignore" 2>/dev/null; then
            git show "${policy_ref}:.gitleaksignore" > "${policy}/.gitleaksignore"
          fi
          echo "scanning: $log_opts"

          # --ignore-gitleaks-allow for the same reason: a `gitleaks:allow` comment on the
          # secret's own new line is a third self-service bypass.
          rc=0
          gitleaks git . \
            --log-opts="$log_opts" \
            --config="${policy}/.gitleaks.toml" \
            --gitleaks-ignore-path="$policy" \
            --ignore-gitleaks-allow \
            --exit-code="$LEAK_CODE" \
            --redact --verbose --no-banner --platform github \
            --report-format json --report-path leaks.json || rc=$?

          [ "$rc" -eq 0 ] && exit 0
          # Any other non-zero is gitleaks failing, not a leak. Don't cry wolf in Slack.
          if [ "$rc" -ne "$LEAK_CODE" ]; then
            echo "::error::gitleaks failed to run (exit $rc) — this is not a finding"
            exit "$rc"
          fi

          findings=$(jq -r 'group_by(.RuleID) | map("\(length)x \(.[0].RuleID)") | join(", ")' leaks.json)
          printf 'findings=%s\n' "$findings" >> "$GITHUB_OUTPUT"
          printf 'where=%s\n' "$where" >> "$GITHUB_OUTPUT"
          exit 1

      # Rule ids, counts and where it happened — never the secret, never the file path, both
      # of which are attacker-controlled text on an untrusted branch. The run log has the
      # rest: --verbose prints each finding's file, line and .gitleaksignore fingerprint with
      # the value redacted.
      #
      # Fork PRs never get org secrets, so the token would be empty and this would fail red
      # for a reason unrelated to the finding. The scan itself still runs and still blocks the
      # merge there — the alert is what's skipped, not the check.
      - name: Notify Slack
        if: >-
          failure() && steps.scan.outputs.findings != ''
          && github.event.pull_request.head.repo.fork != true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_ACTIONS_BOT_TOKEN }}
          CHANNEL_ID: "C08BS6CDY4X"
          FINDINGS: ${{ steps.scan.outputs.findings }}
          WHERE: ${{ steps.scan.outputs.where }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          [ -n "$SLACK_BOT_TOKEN" ] || { echo "::warning::no Slack token; skipping alert"; exit 0; }

          # jq builds the payload so rule ids and branch names are JSON-escaped rather than
          # filtered — the string can't break the request or inject mrkdwn.
          jq -n \
            --arg channel "$CHANNEL_ID" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg where "$WHERE" \
            --arg findings "$FINDINGS" \
            --arg actor "$GITHUB_ACTOR" \
            --arg run_url "$RUN_URL" \
            '{channel: $channel,
              text: ":rotating_light: Secret found in \($repo) — \($findings)",
              blocks: [
                {type: "section", text: {type: "mrkdwn",
                  text: ":rotating_light: *Secret found in \($repo)*"}},
                {type: "section", text: {type: "mrkdwn",
                  text: "\($where) — \($findings). Treat the credential as burned: rotate it first, then scrub it from the branch."}},
                {type: "section", text: {type: "mrkdwn",
                  text: "Pushed by: *\($actor)*   <\($run_url)|Run Link>"}}
              ]}' > payload.json

          resp=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data @payload.json)
          ok=$(printf '%s' "$resp" | jq -r '.ok')
          if [ "$ok" != "true" ]; then
            echo "::error::Slack rejected the alert: $(printf '%s' "$resp" | jq -r '.error')"
            exit 1
          fi
          echo "alert delivered to ${CHANNEL_ID}"
