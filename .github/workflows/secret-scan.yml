# DOPE-1327 — org-wide secret scan entrypoint.
#
# This file is not meant to be copied into repos. It is injected into them by the
# organization ruleset's `workflows` rule, the same way validate-pr.yml is, so enrolling a
# repo is a ruleset edit rather than a PR against that repo. The ruleset entry is:
#
#   { "path": ".github/workflows/secret-scan.yml",
#     "repository_id": 1235329652,          # DroneBase/.github
#     "ref": "refs/heads/main" }
#
# The scan itself lives in reusable-workflows/gitleaks_scan.yaml — gitleaks over only the
# commits a change adds, never full history, with the rule policy read from the trusted base
# so a PR cannot allowlist its own finding. See that file's header for the details.
#
# Because it runs inside every repo, it cannot hardcode branch names: the org has repos whose
# default branch is main, master, staging and develop. Hence the `if` below rather than a
# `branches:` filter.

name: Secret Scan

on:
  pull_request:
  push:

jobs:
  secret-scan:
    # Every PR, plus pushes that land on whatever this repo calls its default branch — a
    # direct push there never opens a PR and would otherwise skip the check entirely.
    if: >-
      github.event_name == 'pull_request'
      || github.ref_name == github.event.repository.default_branch
    uses: DroneBase/reusable-workflows/.github/workflows/gitleaks_scan.yaml@DOPE-1327/gitleaks-pr-scan  # TEMP: flip to @main before merge
    secrets: inherit
