name: PR Description Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    name: Validate PR Description
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check required sections
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number ?? context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const body = (pr.body ?? '').replace(/<!--[\s\S]*?-->/g, '');

            if (body.trim().length < 50) {
              core.setFailed('PR description is empty or too short. Please fill out the template.');
              return;
            }

            // Require a Resolves: line with an actual ticket reference
            if (!/Resolves:\s*[A-Z]+-\d+/i.test(body) && !/Resolves:\s*https?:\/\//i.test(body)) {
              core.setFailed(
                'Missing linked ticket. Add "Resolves: TICKET-123" (or a URL) to your PR description.'
              );
              return;
            }

            // Require AI-Assist trailer
            const aiAssistMatch = body.match(/^AI-Assist:\s*(.+)$/im);
            if (!aiAssistMatch) {
              core.setFailed(
                'Missing AI-Assist trailer. Add "AI-Assist: yes" or "AI-Assist: no" to your PR description.'
              );
              return;
            }

            const aiAssist = aiAssistMatch[1].trim().toLowerCase();
            if (!['yes', 'no'].includes(aiAssist)) {
              core.setFailed(
                `Invalid AI-Assist value "${aiAssistMatch[1].trim()}". Must be "yes" or "no".`
              );
              return;
            }

            // If AI was used, require AI-Tool and AI-Mode
            if (aiAssist === 'yes') {
              const aiToolMatch = body.match(/^AI-Tool:\s*(.+)$/im);
              if (!aiToolMatch || !aiToolMatch[1].trim()) {
                core.setFailed(
                  'AI-Assist is "yes" but AI-Tool is missing. Add "AI-Tool: copilot|claude|chatgpt|cursor|other".'
                );
                return;
              }

              const validTools = ['copilot', 'claude', 'chatgpt', 'cursor', 'other'];
              const tool = aiToolMatch[1].trim().toLowerCase();
              if (!validTools.includes(tool)) {
                core.setFailed(
                  `Invalid AI-Tool value "${aiToolMatch[1].trim()}". Must be one of: ${validTools.join(', ')}.`
                );
                return;
              }

              const aiModeMatch = body.match(/^AI-Mode:\s*(.+)$/im);
              if (!aiModeMatch || !aiModeMatch[1].trim()) {
                core.setFailed(
                  'AI-Assist is "yes" but AI-Mode is missing. Add "AI-Mode: generated|assisted|reviewed".'
                );
                return;
              }

              const validModes = ['generated', 'assisted', 'reviewed'];
              const mode = aiModeMatch[1].trim().toLowerCase();
              if (!validModes.includes(mode)) {
                core.setFailed(
                  `Invalid AI-Mode value "${aiModeMatch[1].trim()}". Must be one of: ${validModes.join(', ')}.`
                );
                return;
              }
            }

            console.log('PR description validation passed.');
