name: PR Description Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    name: Validate PR Description
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check required sections
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number ?? context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const body = pr.body ?? '';

            // Check that body is not just the unedited template
            if (body.trim().length < 50) {
              core.setFailed('PR description is empty or too short. Please fill out the template.');
              return;
            }

            // Require a Resolves: line with an actual ticket reference
            if (!/Resolves:\s*[A-Z]+-\d+/i.test(body) && !/Resolves:\s*https?:\/\//i.test(body)) {
              core.setFailed(
                'Missing linked ticket. Add "Resolves: TICKET-123" (or a URL) to your PR description.'
              );
              return;
            }

            // Require at least one checked checkbox
            if (!/(- \[x\])/i.test(body)) {
              core.setFailed(
                'No checkboxes are checked. Please complete the PR template checklist.'
              );
              return;
            }

            console.log('PR description validation passed.');
